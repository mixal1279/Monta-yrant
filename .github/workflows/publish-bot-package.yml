name: Publish MontaZyrant bot package

on:
  workflow_run:
    workflows: ["Build MontaZyrant Bot for Pterodactyl"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pobierz artefakt z kompilacji
        uses: actions/download-artifact@v4
        with:
          name: montazyrant-bot-node22-linux-x64
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Przygotuj paczke
        shell: bash
        run: |
          set -euo pipefail
          PACZKA="$(find artifact -maxdepth 2 -type f -name 'montazyrant-bot-node22-linux-x64.tar.gz' -print -quit)"
          test -n "$PACZKA"
          mkdir -p deploy
          install -m 0644 "$PACZKA" deploy/montazyrant-bot-node22-linux-x64.tar.gz
          test ! -e deploy/.env

      - name: Zapisz paczke w repozytorium
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/montazyrant-bot-node22-linux-x64.tar.gz
          if git diff --cached --quiet; then
            echo "Paczka nie zmienila sie — brak nowego commita."
            exit 0
          fi
          git commit -m "Publish built bot package"
          git push
