name: Upload MontaZyrant node_modules to Pterodactyl

on:
  workflow_run:
    workflows: ["Build MontaZyrant Bot dependencies"]
    types: [completed]

permissions:
  actions: read

jobs:
  upload:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Pobierz paczkę node_modules
        uses: actions/download-artifact@v4
        with:
          name: montazyrant-node-modules-node22-linux-x64
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sprawdź paczkę
        run: |
          set -euo pipefail
          test -s artifact/node_modules.tar.gz
          tar -tzf artifact/node_modules.tar.gz >/dev/null

      - name: Wyślij wyłącznie node_modules przez SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: ./artifact/node_modules.tar.gz
          remote_path: /
          sftp_only: true
          delete_remote_files: false
