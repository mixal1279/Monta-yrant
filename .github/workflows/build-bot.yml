name: Build MontaZyrant Bot dependencies

on:
  workflow_dispatch:
  push:
    paths:
      - "bot-source.tar.gz"
      - ".github/workflows/build-bot.yml"
      - ".github/workflows/publish-bot-package.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sprawdź i rozpakuj kod źródłowy
        run: |
          set -euo pipefail
          test -f bot-source.tar.gz
          tar -tzf bot-source.tar.gz >/dev/null
          mkdir -p bot
          tar -xzf bot-source.tar.gz -C bot

      - name: Sprawdź projekt
        working-directory: bot
        run: |
          test -f package.json
          test -f index.js
          node -e "const p=require('./package.json'); if (!p.dependencies || !p.dependencies['better-sqlite3']) process.exit(1)"

      - name: Zbuduj node_modules dla Node.js 22 Linux x64
        working-directory: bot
        run: |
          npm install --omit=dev --no-audit --no-fund --maxsockets=2 --build-from-source
          node -e "require('better-sqlite3'); console.log('better-sqlite3 działa')"

      - name: Spakuj wyłącznie node_modules
        run: |
          set -euo pipefail
          test -d bot/node_modules
          tar -czf node_modules.tar.gz -C bot node_modules
          tar -tzf node_modules.tar.gz | head -n 10

      - name: Udostępnij paczkę zależności
        uses: actions/upload-artifact@v4
        with:
          name: montazyrant-node-modules-node22-linux-x64
          path: node_modules.tar.gz
          if-no-files-found: error
          retention-days: 3
