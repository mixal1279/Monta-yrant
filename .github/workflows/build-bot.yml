name: Build and upload MontaZyrant node_modules

on:
  workflow_dispatch:
  push:
    paths:
      - "bot-source.tar.gz"
      - ".github/workflows/build-bot.yml"

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-22.04
    container:
      image: node:22-alpine

    steps:
      - name: Zainstaluj narzędzia kompilacji
        run: apk add --no-cache bash python3 make g++ openssh-client

      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Rozpakuj i sprawdź kod źródłowy
        run: |
          set -eu
          test -f bot-source.tar.gz
          tar -tzf bot-source.tar.gz >/dev/null
          mkdir -p bot
          tar -xzf bot-source.tar.gz -C bot
          test -f bot/package.json
          test -f bot/index.js
          node -e "const p=require('./bot/package.json'); if (!p.dependencies?.['better-sqlite3']) process.exit(1)"

      - name: Zbuduj zależności dla Node 22 i Alpine Linux
        working-directory: bot
        run: |
          set -eu
          npm install --omit=dev --no-audit --no-fund --maxsockets=2 --build-from-source
          node -e "require('better-sqlite3'); console.log('better-sqlite3 działa na Alpine')"
          test -f node_modules/better-sqlite3/build/Release/better_sqlite3.node

      - name: Przygotuj katalog node_modules
        run: |
          set -eu
          test -d bot/node_modules
          mkdir -p deploy/node_modules
          cp -a bot/node_modules/. deploy/node_modules/

      - name: Wyślij wyłącznie node_modules przez SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: ./deploy/*
          remote_path: /
          sftp_only: true
          delete_remote_files: false
